name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs a secret. The suite is hermetic — no network, no API key —
# so it runs the same on a fork's pull request as on main.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # After the build, not with the other three: the example imports from
      # `dist/`, which is gitignored and therefore absent when `typecheck`
      # runs. The script builds again so that running it by hand works from a
      # clean checkout; here that second compile is the declared cost of
      # checking the example at all.
      - run: npm run typecheck:example
      - run: npm test
